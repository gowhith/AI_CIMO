services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cimo
      POSTGRES_PASSWORD: cimo
      POSTGRES_DB: cimo
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimo -d cimo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://cimo:cimo@postgres:5432/cimo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      WATSONX_ENABLED: ${WATSONX_ENABLED:-false}
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
      WATSONX_URL: ${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      WATSONX_MODEL_ID: ${WATSONX_MODEL_ID:-ibm/granite-3-8b-instruct}
      CORS_ORIGINS: '["http://localhost:5180","http://127.0.0.1:5180"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8050:8000"

  worker:
    build: ./backend
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://cimo:cimo@postgres:5432/cimo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WATSONX_ENABLED: ${WATSONX_ENABLED:-false}
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
      WATSONX_URL: ${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      WATSONX_MODEL_ID: ${WATSONX_MODEL_ID:-ibm/granite-3-8b-instruct}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build: ./backend
    command: ["beat"]
    environment:
      DATABASE_URL: postgresql+psycopg://cimo:cimo@postgres:5432/cimo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8050/api/v1
    ports:
      - "5180:5173"
    depends_on:
      - api

volumes:
  pgdata:
