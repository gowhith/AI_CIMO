name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to IBM Container Registry
        uses: docker/login-action@v3
        with:
          registry: us.icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: us.icr.io/${{ vars.ICR_NAMESPACE }}/ai-cimo-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: us.icr.io/${{ vars.ICR_NAMESPACE }}/ai-cimo-frontend:${{ github.sha }}

  deploy-iks:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install kubernetes-service container-registry -f

      - name: IBM Cloud login
        run: |
          ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r ${{ vars.IBM_REGION }} -g ${{ vars.IBM_RESOURCE_GROUP }}
          ibmcloud ks cluster config --cluster ${{ vars.IKS_CLUSTER_NAME }}

      - name: Apply manifests
        run: |
          kubectl apply -k infra/k8s/overlays/${{ inputs.environment }}
          kubectl -n ai-cimo set image deploy/api api=us.icr.io/${{ vars.ICR_NAMESPACE }}/ai-cimo-backend:${{ github.sha }}
          kubectl -n ai-cimo set image deploy/worker worker=us.icr.io/${{ vars.ICR_NAMESPACE }}/ai-cimo-backend:${{ github.sha }}
          kubectl -n ai-cimo set image deploy/beat beat=us.icr.io/${{ vars.ICR_NAMESPACE }}/ai-cimo-backend:${{ github.sha }}
          kubectl -n ai-cimo set image deploy/frontend frontend=us.icr.io/${{ vars.ICR_NAMESPACE }}/ai-cimo-frontend:${{ github.sha }}
          kubectl -n ai-cimo rollout status deploy/api --timeout=300s

      - name: Dogfood — record the deploy in AI-CIMO itself
        run: |
          curl -s -X POST "https://${{ vars.AI_CIMO_HOST }}/api/v1/deployments" \
            -H "Authorization: Bearer ${{ secrets.AI_CIMO_DEPLOY_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d '{"service_id":1,"version":"${{ github.sha }}","commit_id":"${{ github.sha }}"}' || true
