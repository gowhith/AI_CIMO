apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: frontend }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: worker }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ConfigMap, name: ai-cimo-config }
    patch: |
      - op: replace
        path: /data/ENVIRONMENT
        value: dev
