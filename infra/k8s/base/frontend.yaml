apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-cimo
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: us.icr.io/REPLACE_NAMESPACE/ai-cimo-frontend:latest
          ports:
            - containerPort: 5173
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-cimo
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 5173
