# DO NOT COMMIT REAL SECRETS. Apply via External Secrets Operator or `kubectl create secret`.
# Example only — replace with your IBM Cloud Secrets Manager binding in production.
apiVersion: v1
kind: Secret
metadata:
  name: ai-cimo-secrets
  namespace: ai-cimo
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://USER:PASS@HOST:5432/cimo?sslmode=require"
  REDIS_URL: "rediss://:PASS@HOST:6379/0"
  CELERY_BROKER_URL: "rediss://:PASS@HOST:6379/1"
  CELERY_RESULT_BACKEND: "rediss://:PASS@HOST:6379/2"
  JWT_SECRET_KEY: "REPLACE_WITH_64_BYTE_RANDOM"
  WATSONX_API_KEY: "REPLACE"
  WATSONX_PROJECT_ID: "REPLACE"
  SLACK_WEBHOOK_URL: ""
