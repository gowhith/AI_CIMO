apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-cimo
  labels: { app: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: us.icr.io/REPLACE_NAMESPACE/ai-cimo-backend:latest
          args: ["worker"]
          envFrom:
            - configMapRef: { name: ai-cimo-config }
            - secretRef: { name: ai-cimo-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: ai-cimo
  labels: { app: beat }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: beat }
  template:
    metadata:
      labels: { app: beat }
    spec:
      containers:
        - name: beat
          image: us.icr.io/REPLACE_NAMESPACE/ai-cimo-backend:latest
          args: ["beat"]
          envFrom:
            - configMapRef: { name: ai-cimo-config }
            - secretRef: { name: ai-cimo-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
