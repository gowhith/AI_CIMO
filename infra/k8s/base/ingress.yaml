apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-cimo
  namespace: ai-cimo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.ai-cimo.example]
      secretName: ai-cimo-tls
  rules:
    - host: app.ai-cimo.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
          - path: /metrics
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
